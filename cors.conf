# ============================
# CORS HEADERS (global)
# ============================
<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Headers "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
</IfModule>

# ============================
# Handle OPTIONS preflight
# ============================
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]
</IfModule>

# ============================
# Reverse Proxy to Ollama
# ============================
<IfModule mod_proxy.c>
    ProxyRequests Off

    # Chat endpoint
    ProxyPass        "/chat" "http://localhost:11434/api/chat"
    ProxyPassReverse "/chat" "http://localhost:11434/api/chat"

    # Tags endpoint
    ProxyPass        "/tags" "http://localhost:11434/api/tags"
    ProxyPassReverse "/tags" "http://localhost:11434/api/tags"
</IfModule>

# Allow proxying
<Proxy "*">
    Require all granted
</Proxy>
