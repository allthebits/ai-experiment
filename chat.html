<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface with Tabs</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./chat.css" />

</head>
<body class="d-flex flex-column align-items-center">
    <div class="tabs">
        <div class="tab active" data-tab="chat">Chat</div>
        <!-- Add more tabs here -->
    </div>
    <div class="tab-contents">
        <div class="tab-content active" id="tab-chat">
          <div id="input-row" class="w-100">
            <textarea id="msg" rows="6" cols="50" placeholder="Type your message..." class="form-control"></textarea>
            <textarea id="response-props" rows="6" cols="50" readonly class="form-control"></textarea>
          </div>

          <div id="button-row" class="w-100">
            <label for="model-select">Model:</label>
            <select id="model-select" class="form-select custom-select" aria-label="Select Model">
              <option value="llama3">llama3:latest</option>
            </select>
            <button id="send-button" class="btn btn-primary" disabled>Send</button>
          </div>

          <div id="output-container" class="w-100">
            <!-- Replaced textarea with a div for Markdown rendering -->
            <div id="out-markdown"></div>
          </div>
        </div>
        <!-- Add more tab contents here -->
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active classes from tabs and contents
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));

                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                const targetContentId = tab.getAttribute('data-tab');
                const targetContent = document.getElementById(`tab-${targetContentId}`);
                targetContent.classList.add('active');
            });
        });
    </script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Include marked.js -->

<script src="chat.js"></script>

<!-- Bootstrap JS and dependencies (optional, for some components) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> <!-- Changed to bundle for better support -->

</body>
</html>
