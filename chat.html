<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Application</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh; /* Make the body take up the full viewport height */
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #input-row {
      display: flex;
      width: 100%;
      gap: 20px; /* Space between textareas and button */
      margin-bottom: 20px;
    }
    textarea {
      resize: none;
      padding: 10px;
    }
    #msg, #response-props {
      flex: 1; /* Ensure both textareas are of equal size */
    }
    #output-container {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      border: 1px solid #ccc; /* Optional: Add a border for visual separation */
      width: 100%;
      flex-grow: 1; /* Make the container grow vertically to fill remaining space */
    }
    #output-container textarea {
      height: 100%; /* Ensure the textarea fills the height of its container */
      overflow-x: hidden; /* Prevent horizontal scrolling */
      word-wrap: break-word; /* Ensure text wraps based on available width */
    }
    #button-row {
      display: flex;
      justify-content: flex-start; /* Align items to the left */
      gap: 20px; /* Space between elements */
    }
    .custom-select {
      max-width: fit-content; /* Limit the dropdown width */
    }
    /* Custom styles for Markdown rendering */
    #out-markdown {
      padding: 10px;
      border: 1px solid #ccc;
      background-color: #f9f9f9;
      flex-grow: 1;
      overflow-y: auto;
      white-space: pre-wrap; /* Preserve whitespace and wrap text */
    }
  </style>
</head>

<body class="d-flex flex-column align-items-center">

<div id="input-row" class="w-100">
  <textarea id="msg" rows="6" cols="50" placeholder="Type your message..." class="form-control"></textarea>
  <textarea id="response-props" rows="6" cols="50" readonly class="form-control"></textarea>
</div>

<div id="button-row" class="w-100">
  <label for="model-select">Model:</label>
  <select id="model-select" class="form-select custom-select" aria-label="Select Model">
    <option value="llama3">llama3:latest</option>
  </select>
  <button id="send-button" class="btn btn-primary" disabled>Send</button>
</div>

<div id="output-container" class="w-100">
  <!-- Replaced textarea with a div for Markdown rendering -->
  <div id="out-markdown"></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Include marked.js -->

<script src="chat.js"></script>

<!-- Bootstrap JS and dependencies (optional, for some components) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> <!-- Changed to bundle for better support -->

</body>
</html>
