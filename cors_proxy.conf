# ============================
# Logging (debug proxy + dumpio)
# ============================
LogLevel proxy:debug proxy_http:debug dumpio:trace7 rewrite:trace3

#DumpIOInput On
#DumpIOOutput On

# ============================
# Strip headers that cause Ollama to return 403
# ============================
RequestHeader unset Origin
RequestHeader unset Referer
#RequestHeader unset X-Forwarded-Host
#RequestHeader unset X-Forwarded-Server
#RequestHeader unset sec-gpc
#RequestHeader unset DNT
#RequestHeader unset Accept-Encoding

ProxyPreserveHost Off

# ============================
# Reverse Proxy Backend
# ============================
# Hardcode backend to avoid variable expansion issues
# (Apache does NOT expand ${VAR} inside ProxyPass)
Define OLLAMA_BACKEND ${OLLAMA_BACKEND}

# ============================
# CORS HEADERS (global)
# ============================
<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Headers "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
</IfModule>

# ============================
# Handle OPTIONS preflight
# ============================
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]
</IfModule>

# ============================
# Reverse Proxy to Ollama
# ============================
<IfModule mod_proxy.c>
    ProxyRequests Off

# Chat endpoint
    ProxyPass        "/chat" "${OLLAMA_BACKEND}/api/chat"
    ProxyPassReverse "/chat" "${OLLAMA_BACKEND}/api/chat"

# Tags endpoint
    ProxyPass        "/tags" "${OLLAMA_BACKEND}/api/tags"
    ProxyPassReverse "/tags" "${OLLAMA_BACKEND}/api/tags"
</IfModule>

# ============================
# Allow proxying
# ============================
<Proxy "*">
    Require all granted
</Proxy>

<Proxy "${OLLAMA_BACKEND}">
    Require all granted
</Proxy>

# ============================
# Allow access to proxied URL paths
# ============================
<Location "/chat">
    Require all granted
</Location>

<Location "/tags">
    Require all granted
</Location>

# ============================
# Allow static files
# ============================
<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>